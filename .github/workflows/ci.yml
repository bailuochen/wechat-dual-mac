name: Build and test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test copy isolation and failure recovery
        run: swift test
      - name: Build universal application
        run: bash scripts/build.sh --universal
      - uses: actions/upload-artifact@v4
        with:
          name: WeChatDual-macOS
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
